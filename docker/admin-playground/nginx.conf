server {
  listen 443 ssl;
  server_name porta-admin-playground.ci.portaidentity.com;

  ssl_certificate /etc/nginx/tls/server.pem;
  ssl_certificate_key /etc/nginx/tls/server-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Branding uploads carry bounded base64 JSON and need a larger limit than ordinary requests.
  location ~ ^/api/admin/organizations/[^/]+/branding/(?:logo|favicon)$ {
    client_max_body_size 3m;
    proxy_pass http://porta:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://porta:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
