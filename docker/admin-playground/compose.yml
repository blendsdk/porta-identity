name: porta-admin-playground

services:
  postgres:
    image: postgres:16-alpine
    env_file: runtime/secrets.env
    environment:
      POSTGRES_DB: porta
      POSTGRES_USER: porta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U porta -d porta']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [playground]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [playground]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '127.0.0.1:${PORTA_ADMIN_MAILHOG_PORT:-8026}:8025'
    networks: [playground]

  porta:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    env_file: runtime/secrets.env
    environment:
      NODE_ENV: development
      PORT: '3000'
      HOST: 0.0.0.0
      ISSUER_BASE_URL: 'https://porta-admin-playground.ci.portaidentity.com:${PORTA_ADMIN_HTTPS_PORT:-3543}'
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      SMTP_FROM: admin@playground.porta.test
      TRUST_PROXY: 'true'
      LOG_LEVEL: info
      PORTA_AUTO_MIGRATE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [playground]

  nginx:
    image: nginx:1.29-alpine
    ports:
      - '127.0.0.1:${PORTA_ADMIN_HTTPS_PORT:-3543}:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/tls:/etc/nginx/tls:ro
    depends_on:
      porta:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --no-check-certificate https://127.0.0.1/health >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [playground]

volumes:
  postgres_data:
  redis_data:

networks:
  playground:
    driver: bridge
