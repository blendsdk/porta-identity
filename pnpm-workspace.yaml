packages:
  - 'packages/*'

# Keep pnpm-lock.yaml single-document so GitHub's dependency graph can read the
# project graph. CI and Docker still install the pinned pnpm 12.15.0 directly.
pmOnFail: ignore

nodeLinker: hoisted
linkWorkspacePackages: true
minimumReleaseAge: 0
strictDepBuilds: true
engineStrict: true
savePrefix: ''
autoInstallPeers: false

allowBuilds:
  argon2: true
  esbuild: true
  fs-ext-extra-prebuilt: true
  fsevents: true

skills:
  dirs: []

overrides:
  co-body>qs: 6.16.0
  minimatch>brace-expansion: 5.0.12
  fast-copy: 4.2.0
