# Publishes the exact revision that passed the main-branch Build and Test workflow.
name: Release

on:
  workflow_run:
    workflows: ['Build and Test']
    branches: [main]
    types: [completed]

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish coordinated release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install pinned release tools
        run: yarn install --frozen-lockfile

      - name: Build publishable packages
        run: yarn build

      - name: Validate committed candidate
        id: candidate
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          test "$EVENT_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          yarn release:preflight
          node_modules/.bin/npm --version
          version=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.version)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # A promotion that does not bump the version (for example, a workflow or
      # documentation change) re-enters this workflow for a version that is
      # already fully released. Treat that as a successful no-op instead of
      # failing on an existing tag that points at the original release commit.
      - name: Detect completed release
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          packages_published=true
          for package_name in server sdk cli; do
            found=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" version 2>/dev/null || true)
            if [ "$found" != "$RELEASE_VERSION" ]; then packages_published=false; fi
          done
          tag_sha=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ "$packages_published" = true ] && [ -n "$tag_sha" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG is already complete; this run is a no-op."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack expected release artifacts
        run: |
          mkdir release-artifacts
          node_modules/.bin/npm pack --workspace @portaidentity/server --pack-destination release-artifacts
          node_modules/.bin/npm pack --workspace @portaidentity/sdk --pack-destination release-artifacts
          node_modules/.bin/npm pack --workspace @portaidentity/cli --pack-destination release-artifacts

      # A re-run after a partial or post-publish failure must not fail on
      # "cannot publish over the previously published versions". Skip the
      # publish when every package already carries this version.
      - name: Check published state
        id: published
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          missing=0
          for package_name in server sdk cli; do
            found=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" version 2>/dev/null || true)
            if [ "$found" != "$RELEASE_VERSION" ]; then missing=$((missing + 1)); fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "all_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm Trusted Publishing
        if: steps.published.outputs.all_published != 'true'
        run: yarn release:publish

      # npm view can lag the publish by minutes, so retry the version,
      # integrity, and provenance checks for up to 400s per package instead of
      # failing a release whose packages are already live.
      - name: Verify published packages
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          package_integrity() {
            printf 'sha512-'
            openssl dgst -sha512 -binary "$1" | openssl base64 -A
          }
          for package_name in server sdk cli; do
            expected_integrity=$(package_integrity "release-artifacts/portaidentity-$package_name-$RELEASE_VERSION.tgz")
            verified=false
            for attempt in $(seq 1 40); do
              published=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" version 2>/dev/null || true)
              if [ "$published" = "$RELEASE_VERSION" ]; then
                published_integrity=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
                provenance=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" dist.attestations.provenance.predicateType 2>/dev/null || true)
                if [ "$published_integrity" = "$expected_integrity" ] && [ "$provenance" = 'https://slsa.dev/provenance/v1' ]; then
                  verified=true
                  break
                fi
              fi
              if [ "$attempt" -lt 40 ]; then sleep 10; fi
            done
            if [ "$verified" != true ]; then
              echo "::error::@portaidentity/$package_name@$RELEASE_VERSION was not verifiable within the deadline"
              exit 1
            fi
          done

      # Independent of the publish step so a re-run can complete a release whose
      # packages were already published. Both operations are idempotent.
      - name: Create release tag and GitHub release
        if: steps.released.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          remote_tag_sha=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ -n "$remote_tag_sha" ]; then
            test "$remote_tag_sha" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_SHA"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi

      - name: Dispatch tested Docker release
        if: steps.released.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          # The workflow-created tag uses GITHUB_TOKEN, which does not emit a
          # tag-push event, so dispatch explicitly. Skip when the image already
          # exists so a re-run does not rebuild and repush the same tags.
          version="${RELEASE_TAG#v}"
          if docker manifest inspect "blendsdk/porta:$version" >/dev/null 2>&1; then
            echo "Docker image blendsdk/porta:$version already exists; skipping dispatch"
            exit 0
          fi
          gh workflow run docker.yml --ref main \
            -f tag="$RELEASE_TAG" \
            -f sha="${{ github.event.workflow_run.head_sha }}"
