# One manual dispatch performs the whole coordinated release: version bump, changelog and release
# notes, commit and tag, npm publish, GitHub Release, Docker dispatch, and a safe develop sync.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry_run:
        description: Rehearse without publishing, pushing, or tagging
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish coordinated release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install pinned release tools
        run: yarn install --frozen-lockfile

      # Lockstep commits the bump, so the runner needs a git identity.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A re-run after a successful release finds HEAD already tagged. In that case the bump and
      # publish are skipped and the remaining steps (release, Docker, sync) resume idempotently.
      - name: Resolve release mode
        id: mode
        shell: bash
        run: |
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "head_tagged=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "head_tagged=" >> "$GITHUB_OUTPUT"
          fi

      # Fail closed: only release a main revision that already passed the main CI gate.
      - name: Verify the revision passed Build and Test
        if: steps.mode.outputs.head_tagged == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          head_sha=$(git rev-parse HEAD)
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Build and Test" and .event == "push") | .conclusion] | if any(. == "success") then "ok" else "missing" end')
          if [ "$result" != "ok" ]; then
            echo "::error::main $head_sha has no successful Build and Test run"
            exit 1
          fi

      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          node_modules/.bin/lockstep version --type "${{ inputs.bump }}" --no-git-commit --no-changelog
          version=$(node --input-type=module -e "import m from './package.json' with { type: 'json' }; process.stdout.write(m.version)")
          echo "Dry run: a full release would publish v$version"
          node_modules/.bin/lockstep publish --tag latest --dry

      # Bump before build so Lockstep's `git add .` commits only the version, changelog, and notes.
      - name: Bump version and generate release notes
        id: bump
        if: ${{ !inputs.dry_run && steps.mode.outputs.head_tagged == '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is not clean before the version bump"
            exit 1
          fi
          node_modules/.bin/lockstep version --type "${{ inputs.bump }}" --ci

      - name: Read release version
        id: release
        shell: bash
        run: |
          version=$(node --input-type=module -e "import m from './package.json' with { type: 'json' }; process.stdout.write(m.version)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build publishable packages
        if: ${{ !inputs.dry_run }}
        run: yarn build

      - name: Validate committed candidate
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          yarn release:preflight
          node_modules/.bin/npm --version

      # A promotion that does not bump the version re-enters this workflow for a version that is
      # already fully released. Treat that as a complete no-op.
      - name: Detect completed release
        id: released
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          packages_published=true
          for package_name in server sdk cli; do
            found=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" version 2>/dev/null || true)
            if [ "$found" != "$RELEASE_VERSION" ]; then packages_published=false; fi
          done
          tag_sha=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ "$packages_published" = true ] && [ -n "$tag_sha" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG is already complete; this run is a no-op."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack expected release artifacts
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' }}
        run: |
          mkdir release-artifacts
          node_modules/.bin/npm pack --workspace @portaidentity/server --pack-destination release-artifacts
          node_modules/.bin/npm pack --workspace @portaidentity/sdk --pack-destination release-artifacts
          node_modules/.bin/npm pack --workspace @portaidentity/cli --pack-destination release-artifacts

      # A re-run after a partial or post-publish failure must not fail on
      # "cannot publish over the previously published versions". Skip the publish when every package
      # already carries this version.
      - name: Check published state
        id: published
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          missing=0
          for package_name in server sdk cli; do
            found=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" version 2>/dev/null || true)
            if [ "$found" != "$RELEASE_VERSION" ]; then missing=$((missing + 1)); fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "all_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm Trusted Publishing
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' && steps.published.outputs.all_published != 'true' }}
        run: yarn release:publish

      # npm view can lag the publish by minutes, so retry the version, integrity, and provenance
      # checks for up to 400s per package instead of failing a release whose packages are already live.
      - name: Verify published packages
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          package_integrity() {
            printf 'sha512-'
            openssl dgst -sha512 -binary "$1" | openssl base64 -A
          }
          for package_name in server sdk cli; do
            expected_integrity=$(package_integrity "release-artifacts/portaidentity-$package_name-$RELEASE_VERSION.tgz")
            verified=false
            for attempt in $(seq 1 40); do
              published=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" version 2>/dev/null || true)
              if [ "$published" = "$RELEASE_VERSION" ]; then
                published_integrity=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
                provenance=$(node_modules/.bin/npm view "@portaidentity/$package_name@$RELEASE_VERSION" dist.attestations.provenance.predicateType 2>/dev/null || true)
                if [ "$published_integrity" = "$expected_integrity" ] && [ "$provenance" = 'https://slsa.dev/provenance/v1' ]; then
                  verified=true
                  break
                fi
              fi
              if [ "$attempt" -lt 40 ]; then sleep 10; fi
            done
            if [ "$verified" != true ]; then
              echo "::error::@portaidentity/$package_name@$RELEASE_VERSION was not verifiable within the deadline"
              exit 1
            fi
          done

      # Push the bump commit and its lightweight tag only after a successful publish. The credential
      # is injected per command and never persisted in the git configuration.
      - name: Push release commit and tag
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' && steps.mode.outputs.head_tagged == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          cred="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$cred" HEAD:refs/heads/main
          git push "$cred" "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi

      - name: Dispatch tested Docker release
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          # The workflow-created tag uses GITHUB_TOKEN, which does not emit a tag-push event, so
          # dispatch explicitly. Skip when the image already exists so a re-run does not rebuild it.
          version="${RELEASE_TAG#v}"
          if docker manifest inspect "blendsdk/porta:$version" >/dev/null 2>&1; then
            echo "Docker image blendsdk/porta:$version already exists; skipping dispatch"
            exit 0
          fi
          gh workflow run docker.yml --ref main \
            -f tag="$RELEASE_TAG" \
            -f sha="$(git rev-parse HEAD)"

      # Bring the bump back to develop without rewriting its history. Never forces.
      - name: Sync develop with the release bump
        if: ${{ !inputs.dry_run && steps.released.outputs.complete != 'true' && steps.mode.outputs.head_tagged == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          cred="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bump_sha=$(git rev-parse HEAD)
          git fetch origin main develop
          if git merge-base --is-ancestor origin/develop "$bump_sha"; then
            git push "$cred" "$bump_sha":refs/heads/develop
          else
            git checkout -B sync/develop-release origin/develop
            if git cherry-pick "$bump_sha"; then
              git push "$cred" sync/develop-release:refs/heads/develop
            else
              git cherry-pick --abort
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "Release $RELEASE_TAG: develop sync needs a manual cherry-pick" \
                --body "The release bump commit $bump_sha could not be cherry-picked onto develop automatically. Apply it manually: git checkout develop && git cherry-pick $bump_sha. The release itself succeeded."
            fi
          fi
