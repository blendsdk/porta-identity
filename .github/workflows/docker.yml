# Publishes one tested release revision under all supported Docker aliases.
name: Docker Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic release tag, including the v prefix
        required: true
        type: string
      sha:
        description: Tested commit that the release tag must resolve to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push release image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and tested revision
        id: release
        env:
          DISPATCH_SHA: ${{ inputs.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            release_tag="$DISPATCH_TAG"
            expected_sha="$DISPATCH_SHA"
          else
            release_tag="$PUSH_TAG"
            expected_sha="$PUSH_SHA"
          fi

          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
          tag_sha=$(git rev-list -n 1 "$release_tag")
          test "$tag_sha" = "$expected_sha"
          test "$(git rev-parse HEAD)" = "$expected_sha"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: blendsdk/porta
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: blendsdk/porta
          readme-filepath: docker/DOCKERHUB.md
