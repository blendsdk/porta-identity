# Porta branch CI validates the monorepo without publishing or deploying artifacts.
name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Monorepo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: porta_test
          POSTGRES_USER: porta
          POSTGRES_PASSWORD: porta_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      TEST_DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      TEST_SMTP_HOST: localhost
      TEST_SMTP_PORT: '1025'
      TEST_MAILHOG_URL: http://localhost:8025
      SIGNING_KEY_ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify structure and active packages
        run: pnpm verify

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: porta_test
          POSTGRES_USER: porta
          POSTGRES_PASSWORD: porta_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      TEST_DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      TEST_SMTP_HOST: localhost
      TEST_SMTP_PORT: '1025'
      TEST_MAILHOG_URL: http://localhost:8025
      SIGNING_KEY_ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build active packages
        run: pnpm build
      - name: Run UI tests
        run: pnpm test:ui

  harness:
    name: OIDC Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build harness image with GHA cache
        run: |
          docker buildx build \
            --file test-harness/Dockerfile \
            --tag porta-harness-ci:latest \
            --cache-from type=gha,scope=porta-harness-ci \
            --cache-to type=gha,mode=max,scope=porta-harness-ci \
            --load .
      - name: Run OIDC harness
        run: pnpm harness:test
        env:
          HARNESS_BUILD_CACHE_FILE: test-harness/docker-compose.ci.yml
          COMPOSE_BAKE: 'true'
          HARNESS_STREAM_BUILD_OUTPUT: '1'

  docs:
    name: Public Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build public documentation
        run: pnpm docs:build

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: porta-ci:latest
          cache-from: type=gha,scope=porta-ci
          cache-to: type=gha,mode=max,scope=porta-ci

  audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
