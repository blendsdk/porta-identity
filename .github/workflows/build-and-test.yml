# Porta branch CI validates the monorepo without publishing or deploying artifacts.
name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Monorepo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: porta_test
          POSTGRES_USER: porta
          POSTGRES_PASSWORD: porta_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      TEST_DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      TEST_SMTP_HOST: localhost
      TEST_SMTP_PORT: '1025'
      TEST_MAILHOG_URL: http://localhost:8025
      SIGNING_KEY_ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify structure and active packages
        run: yarn verify

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: porta_test
          POSTGRES_USER: porta
          POSTGRES_PASSWORD: porta_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      TEST_DATABASE_URL: postgresql://porta:porta_dev@localhost:5432/porta_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      TEST_SMTP_HOST: localhost
      TEST_SMTP_PORT: '1025'
      TEST_MAILHOG_URL: http://localhost:8025
      SIGNING_KEY_ENCRYPTION_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Build active packages
        run: yarn build
      - name: Run UI tests
        run: yarn test:ui

  harness:
    name: OIDC Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run OIDC harness
        run: yarn harness:test

  docs:
    name: Public Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build public documentation
        run: yarn docs:build

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --file docker/Dockerfile --tag porta-ci .

  audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level high
