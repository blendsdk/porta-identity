# CI-only BuildKit cache for the retained OIDC harness image.
# Included by the harness lifecycle only when HARNESS_BUILD_CACHE_FILE is set.
# Compose Bake reads the top-level x-bake cache options; the build-local fields
# remain for non-Bake Compose clients.
x-bake:
  cache-from:
    - type=gha,scope=porta-harness-ci
  cache-to:
    - type=gha,mode=max,scope=porta-harness-ci

services:
  porta:
    build:
      cache_from:
        - type=gha,scope=porta-harness-ci
      cache_to:
        - type=gha,mode=max,scope=porta-harness-ci
